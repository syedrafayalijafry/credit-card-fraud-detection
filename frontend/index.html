<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Card Fraud Detection</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            <i class="fa-solid fa-shield-halved"></i>

            <div>

                <h1>Credit Card Fraud Detection</h1>

                <p>AI Powered Transaction Risk Analysis</p>

            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- ================= INPUT CARD ================= -->

        <section class="card input-card">

            <h2>

                <i class="fa-solid fa-credit-card"></i>

                Transaction Details

            </h2>


            <!-- Transaction Amount -->
            <div class="form-group">
                <label for="transactionAmt">Transaction Amount</label>
                <input type="number" id="transactionAmt" min="0" step="0.01" required>
            </div>

            <!-- Transaction Date -->
            <div class="form-group">
                <label for="transactionDate">Transaction Date</label>
                <input type="date" id="transactionDate" required>
            </div>

            <!-- Transaction Time -->
            <div class="form-group">
                <label for="transactionTime">Transaction Time</label>
                <input type="time" id="transactionTime" required>
            </div>

            <!-- Product -->
            <div class="form-group">
                <label for="product">Product Type</label>
                <select id="product">
                    <option value="W">W - Digital Wallet</option>
                    <option value="C">C - Credit</option>
                    <option value="R">R - Retail</option>
                    <option value="H">H - Household</option>
                    <option value="S">S - Subscription</option>
                </select>
            </div>


            <!-- Card Network -->
            <div class="form-group">
                <label for="cardNetwork">Card Network</label>
                <select id="cardNetwork">
                    <option value="visa">Visa</option>
                    <option value="mastercard">Mastercard</option>
                    <option value="discover">Discover</option>
                    <option value="american express">American Express</option>
                </select>
            </div>

            <!-- Card Type -->
            <div class="form-group">
                <label for="cardType">Card Type</label>
                <select id="cardType">
                    <option value="credit">Credit</option>
                    <option value="debit">Debit</option>
                    <option value="charge card">Charge Card</option>
                </select>
            </div>


            <button id="predictBtn">

                <i class="fa-solid fa-magnifying-glass-chart"></i>

                Analyze Transaction

            </button>

        </section>



        <!-- ================= RESULT CARD ================= -->

        <section class="card result-card">

            <h2>

                <i class="fa-solid fa-chart-line"></i>

                Prediction Result

            </h2>


            <div id="resultContainer">


                <div class="waiting">

                    <i class="fa-solid fa-hourglass-half"></i>

                    <p>

                        Waiting for prediction...

                    </p>

                </div>


                <div class="result-box hidden">


                    <div class="result-item">

                        <span>

                            Fraud Probability

                        </span>

                        <h3 id="probability">

                            --

                        </h3>

                    </div>


                    <div class="progress-bar">

                        <div id="riskBar"></div>

                    </div>


                    <div class="result-item">

                        <span>

                            Status

                        </span>

                        <h3 id="status">

                            --

                        </h3>

                    </div>


                    <div class="result-item">

                        <span>

                            Confidence

                        </span>

                        <h3 id="confidence">

                            --

                        </h3>

                    </div>


                    <div class="result-item">

                        <span>

                            Recommendation

                        </span>

                        <p id="recommendation">

                            --

                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            Developed using FastAPI • LightGBM • HTML • CSS • JavaScript

        </p>

    </footer>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
